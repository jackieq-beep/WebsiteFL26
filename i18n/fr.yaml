faq:
  kicker: "FAQ"
  title: "Vos questions, nos réponses."
  items:
    - q: "Quand sort Football League 2027 ?"
      a: "Football League 2027 (FL27) arrive bientôt sur iPhone et Android. Suis notre page Actus, Instagram ou Discord, ou inscris-toi à la newsletter, pour être prévenu dès sa sortie."
    - q: "Quoi de neuf dans Football League 2027 ?"
      a: "FL27 met le mode Carrière au premier plan avec un nouveau look, des ligues compétitives, de nouveaux systèmes d'entraînement et de transferts et des récompenses de fin de saison. Il apporte aussi une physique des collisions améliorée, des arrêts du gardien affinés et un tout nouveau stade ultramoderne."
    - q: "FL27, c'est la même chose que Football League 2027 ?"
      a: "Oui. FL27 est le nom court de Football League 2027, l'édition 2027 de Football League, le jeu de foot mobile gratuit de Mobile Soccer."
    - q: "Quelles différences entre FL27 et FL26 ?"
      a: "FL27 ajoute un mode Carrière repensé avec des ligues compétitives, de nouveaux systèmes d'entraînement et de transferts et des récompenses de fin de saison, ainsi qu'une physique des collisions améliorée, des arrêts du gardien affinés, un tout nouveau stade et un look plus épuré et moderne."
    - q: "Football League 2027 est-il disponible sur iPhone et Android ?"
      a: "Oui. Football League est disponible sur l'App Store pour iPhone et iPad, et sur Google Play pour les téléphones et tablettes Android."
    - q: "Qui développe Football League ?"
      a: "Football League est développé et édité par Mobile Soccer. Il compte plus de 100 millions de téléchargements et se classe parmi les 10 meilleurs jeux de sport dans plus de 30 grands marchés."
    - q: "Football League est-il gratuit ?"
      a: "Oui. Football League se télécharge et se joue gratuitement sur iPhone, iPad et sur les smartphones et tablettes Android."
    - q: "Quels modes de jeu propose Football League ?"
      a: "Carrière Joueur, Ligues, Coupes et Matchs amicaux, plus des défis quotidiens, des événements live chaque semaine et du PvP local pour affronter tes amis."
    - q: "Peut-on jouer à Football League entre amis ?"
      a: "Oui. Le PvP local te permet d'affronter tes amis en face à face."
    - q: "Y a-t-il des événements live dans Football League ?"
      a: "Oui. De nouveaux événements live et défis arrivent chaque semaine, avec des récompenses exclusives comme des maillots, des joueurs et des pièces. Consulte la page Actus pour voir ce qui se passe en ce moment."
    - q: "En quelles langues sont les commentaires ?"
      a: "Football League propose des commentaires en 16 langues et compte plus de 100 millions de téléchargements dans plus de 200 pays."
    - q: "Comment obtenir de l'aide pour le jeu, mon compte ou un achat ?"
      a: "Écris à notre support joueurs à footballleague2023@gmail.com, ou pose ta question à la communauté sur notre Discord."
    - q: "Où acheter les produits officiels Football League ?"
      a: "Dans la boutique officielle Football League de ce site : maillots, sweats à capuche, vêtements enfants et accessoires, fabriqués à la demande et livrés partout dans le monde."

