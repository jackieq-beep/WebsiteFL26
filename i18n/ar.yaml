faq:
  kicker: "الأسئلة الشائعة"
  title: "أسئلة وأجوبة."
  items:
    - q: "متى تصدر Football League 2027؟"
      a: "Football League 2027 (FL27) قادمة قريبًا على iPhone و Android. تابع صفحة الأخبار أو Instagram أو Discord، أو اشترك في النشرة البريدية، لتعرف لحظة إطلاقها."
    - q: "ما الجديد في Football League 2027؟"
      a: "تضع FL27 وضع المسيرة في الصدارة بمظهر جديد ودوريات تنافسية وأنظمة جديدة للتدريب والانتقالات ومكافآت نهاية الموسم. كما تقدّم فيزياء تصادم محسّنة وتصديات أدق لحارس المرمى وملعبًا جديدًا كليًا بأحدث المواصفات."
    - q: "هل FL27 هي نفسها Football League 2027؟"
      a: "نعم. FL27 هو الاسم المختصر لـ Football League 2027، إصدار 2027 من Football League، لعبة كرة القدم المجانية على الجوال من Mobile Soccer."
    - q: "ما الفرق بين FL27 وFL26؟"
      a: "تضيف FL27 وضع مسيرة بتصميم جديد مع دوريات تنافسية وأنظمة جديدة للتدريب والانتقالات ومكافآت نهاية الموسم، إلى جانب فيزياء تصادم محسّنة وتصديات أدق لحارس المرمى وملعب جديد كليًا ومظهر أنظف وأكثر عصرية."
    - q: "هل Football League 2027 متوفرة على iPhone وAndroid؟"
      a: "نعم. Football League متوفرة على App Store لأجهزة iPhone وiPad، وعلى Google Play لهواتف وأجهزة Android اللوحية."
    - q: "من يطوّر Football League؟"
      a: "تطوّر Football League وتنشرها شركة Mobile Soccer. تجاوزت تنزيلاتها 100 مليون، وهي من بين أفضل 10 ألعاب رياضية في أكثر من 30 سوقًا رئيسية."
    - q: "هل Football League مجانية؟"
      a: "نعم. يمكن تنزيل Football League ولعبها مجانًا على iPhone و iPad وهواتف وأجهزة Android اللوحية."
    - q: "هل يمكن لعب Football League بدون إنترنت؟"
      a: "نعم. يمكنك لعب Football League بدون اتصال بالإنترنت، لذا تعمل على متن الطائرة أو في المترو أو عندما لا تريد استهلاك بيانات الجوال. اتصل بالإنترنت عندما تريد استخدام ميزات اللعبة عبر الإنترنت."
    - q: "ما أوضاع اللعب في Football League؟"
      a: "مسيرة اللاعب، والدوريات، والكؤوس، والمباريات الودية، إلى جانب التحديات اليومية والفعاليات المباشرة كل أسبوع ومباريات PvP محلية لمواجهة أصدقائك."
    - q: "هل يمكنني لعب Football League مع أصدقائي؟"
      a: "نعم. تتيح لك مباريات PvP المحلية مواجهة أصدقائك وجهًا لوجه."
    - q: "هل توجد فعاليات مباشرة في Football League؟"
      a: "نعم. تصل فعاليات مباشرة وتحديات جديدة كل أسبوع، مع مكافآت حصرية مثل الأطقم واللاعبين والعملات. راجع صفحة الأخبار لترى الفعاليات الجارية الآن."
    - q: "ما لغات التعليق المتوفرة؟"
