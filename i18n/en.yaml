    - { label: "Age rating", value: "4+ (App Store)" }
    - { label: "Downloads", value: "100M+" }
  groups:
    - id: basics
      title: "The basics"
      items:
        - id: what-is-football-league
          q: "What is Football League?"
          a: "Football League is a free soccer (football) game for iPhone, iPad and Android phones and tablets, developed and published by Mobile Soccer. It has more than 100 million downloads and ranks among the top 10 sports games in over 30 markets. Football League 2027 (FL27) is the 2027 edition."
        - id: is-football-league-free
          q: "Is Football League free?"
          a: "Yes. Football League is free to download and play on iPhone, iPad and Android. There are optional in-app purchases, such as coin packs, official club kits and a one-time purchase that removes ads, but you don't have to buy anything to play."
        - id: iphone-and-android
          q: "Is Football League 2027 on iPhone and Android?"
          a: "Yes. Football League is on the App Store for iPhone and iPad, and on Google Play for Android phones and tablets."
        - id: is-football-league-suitable-for-kids
          q: "Is Football League suitable for kids?"
          a: "Football League is rated 4+ on the App Store, so it's suitable for all ages. Parents can switch off in-app purchases in the phone's settings."
        - id: who-makes-football-league
          q: "Who makes Football League?"
          a: "Football League is developed and published by Mobile Soccer. It has more than 100 million downloads and ranks among the top 10 sports games in over 30 major markets."
    - id: playing
      title: "Playing"
      items:
        - id: play-with-friends
          q: "Can I play Football League with friends?"
          a: "Yes. Local PvP lets you go head-to-head with friends."
        - id: game-modes
          q: "What game modes are in Football League?"
          a: "Player Career, Leagues, Cups and Friendlies, plus daily challenges, weekly live events and local PvP to go head-to-head with friends."
        - id: career-mode
          q: "Does Football League have a career mode?"
          a: "Yes. Career Mode is at the centre of Football League 2027. Build your Player Career, then compete in leagues with new training and transfer systems and end-of-season rewards."
        - id: controller-support
          q: "Can I play Football League with a controller?"
          a: "Yes. Football League supports game controllers. On a touch screen, you can also choose between custom control modes."
        - id: live-events
          q: "Are there live events in Football League?"
          a: "Yes. New live events and challenges arrive every week, with exclusive rewards such as kits, players and coins. Check the News page to see what's on now."
        - id: commentary-languages
          q: "What languages is the commentary in?"
          a: "Football League has match commentary in 16 languages and more than 100 million downloads in over 200 countries."
    - id: teams
      title: "Teams & competitions"
      items:
        - id: teams-and-players
          q: "How many teams and players are in Football League?"
          a: "Football League has more than 40,000 players, 1,500 clubs and 150 national teams. Manchester City and AS Monaco are officially licensed."
        - id: leagues-and-cups
          q: "Which leagues and cups can you play in Football League?"
          a: "You can play club leagues from Europe, the Americas, Asia and Africa, or set up your own custom league. There are also continental club cups and international cups for national teams."
    - id: fl27
      title: "Football League 2027 (FL27)"
      items:
        - id: fl27-release-date
          q: "When is Football League 2027 coming out?"
          a: "Football League 2027 (FL27) is coming soon on iPhone and Android. Follow our News page, Instagram or Discord, or sign up to the newsletter, to hear the moment it launches."
        - id: whats-new-in-fl27
          q: "What's new in Football League 2027?"
          a: "FL27 puts Career Mode at the centre with a fresh look, competitive leagues, new training and transfer systems and end-of-season rewards. It also brings improved collision physics, refined goalkeeper saves and a brand-new, state-of-the-art stadium."
        - id: fl27-meaning
          q: "Is FL27 the same as Football League 2027?"
          a: "Yes. FL27 is the short name for Football League 2027, the 2027 edition of Football League, the free mobile soccer game from Mobile Soccer."
        - id: fl27-vs-fl26
          q: "How is FL27 different from FL26?"
          a: "FL27 adds a redesigned Career Mode with competitive leagues, new training and transfer systems and end-of-season rewards, plus improved collision physics, refined goalkeeper saves, a brand-new stadium and a cleaner, more modern look."
    - id: help
