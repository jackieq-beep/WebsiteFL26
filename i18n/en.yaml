# Full FAQ page (/faq/). Each answer is written to be quoted on its own by search engines and AI tools.
faq_page:
  meta_title: "Football League FAQ – Free Soccer Game for iPhone & Android"
  meta_description: "Answers about Football League, the free soccer game for iPhone and Android: local PvP with friends, controllers, teams, game modes and FL27."
  kicker: "FAQ"
  title_1: "Questions,"
  title_2: "answered."
  text: "Everything about Football League: price, matches with friends, teams and FL27."
  facts_title: "Football League at a glance"
  toc: "On this page"
  see_all: "See all questions"
  facts:
