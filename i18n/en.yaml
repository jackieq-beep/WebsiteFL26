game_page:
  meta_title: "Football League 2027 – What's New in the Mobile Soccer Game"
  meta_description: "Football League 2027 (FL27): new Career Mode with leagues, training and transfers, local PvP with friends, better physics and keeper saves, and a new stadium."
  kicker: "What's new this season"
  title_1: The new season
  title_2: starts here.
  text: "Football League 2027 (FL27) puts Career Mode at the centre, with competitive leagues, new training and transfer systems and end-of-season rewards. Plus local PvP with friends, improved physics, refined goalkeeper saves and a brand-new stadium."
  facts_title: "Football League 2027 at a glance"
  facts:
    - { label: "Platforms", value: "iPhone, iPad & Android" }
    - { label: "Price", value: "Free to play" }
    - { label: "Developer", value: "Mobile Soccer" }
    - { label: "Official license", value: "Manchester City" }
    - { label: "Ranking", value: "Top 10 sports game in 30+ markets" }
    - { label: "Downloads", value: "100M+" }
  jump: "What's new"
  features:
    - key: ui
      label: "New look"
      title: "A cleaner, more modern look"
      text: "FL27 introduces a refreshed interface with a cleaner, more modern visual style. We've redesigned the home screen and how modes are presented, so navigation is clearer and the whole game has a fresher, more premium look."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Career Mode"
      title: "Career Mode takes centre stage"
      text: "Career Mode has a fresh look in FL27, with competitive leagues, new training and transfer systems, and end-of-season rewards. Build your Player Career, then take on Leagues, Cups and Friendlies."
      images: [u27-career.jpg]
    - key: visuals
      label: "Match day"
      title: "Better on the pitch"
      text: "FL27 upgrades every match: improved collision physics, refined goalkeeper saves, a redesigned pre-match loading screen, updated in-game buttons and a new Goal Moment presentation."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "New stadium"
      title: "A brand-new stadium"
      text: "FL27 brings a brand-new, state-of-the-art stadium where all the action comes to life, with updated branding, new presentation elements and a stronger matchday atmosphere."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Daily challenges"
      title: "New daily challenges"
      text: "New daily challenge content lets you complete short football-based challenges for rewards, adding more variety outside standard matches and longer-term modes."
      images: [u27-penalty.jpg]
  cta_title_1: Ready for
  cta_title_2: kick-off?
  cta_text: "Player Career, Leagues, Cups, Friendlies, daily challenges, weekly live events and local PvP with friends. Free to play on iOS and Android."

