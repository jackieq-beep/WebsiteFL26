faq:
  kicker: "FAQ"
  title: Questions, answered.
  items:
    - q: "When is Football League 2027 coming out?"
      a: "Football League 2027 (FL27) is coming soon on iPhone and Android. Follow our News page, Instagram or Discord, or sign up to the newsletter, to hear the moment it launches."
    - q: "What's new in Football League 2027?"
      a: "FL27 puts Career Mode at the centre with a fresh look, competitive leagues, new training and transfer systems and end-of-season rewards. It also brings improved collision physics, refined goalkeeper saves and a brand-new, state-of-the-art stadium."
    - q: "Is FL27 the same as Football League 2027?"
      a: "Yes. FL27 is the short name for Football League 2027, the 2027 edition of Football League, the free mobile soccer game from Mobile Soccer."
    - q: "How is FL27 different from FL26?"
      a: "FL27 adds a redesigned Career Mode with competitive leagues, new training and transfer systems and end-of-season rewards, plus improved collision physics, refined goalkeeper saves, a brand-new stadium and a cleaner, more modern look."
    - q: "Is Football League 2027 on iPhone and Android?"
      a: "Yes. Football League is on the App Store for iPhone and iPad, and on Google Play for Android phones and tablets."
    - q: "Who makes Football League?"
      a: "Football League is developed and published by Mobile Soccer. It has more than 100 million downloads and ranks among the top 10 sports games in over 30 major markets."
    - q: "Is Football League free?"
      a: "Yes. Football League is free to download and play on iPhone, iPad and Android phones and tablets."
    - q: "What game modes are in Football League?"
      a: "Player Career, Leagues, Cups and Friendlies, plus daily challenges, weekly live events and local PvP to go head-to-head with friends."
    - q: "Can I play Football League with friends?"
      a: "Yes. Local PvP lets you go head-to-head with friends."
    - q: "Are there live events in Football League?"
      a: "Yes. New live events and challenges arrive every week, with exclusive rewards such as kits, players and coins. Check the News page to see what's on now."
    - q: "What languages is the commentary in?"
      a: "Football League has match commentary in 16 languages and more than 100 million downloads in over 200 countries."
    - q: "How do I get help with the game, my account or a purchase?"
      a: "Email our player support team at footballleague2023@gmail.com, or ask the community on our Discord."
    - q: "Where can I buy official Football League merchandise?"
      a: "In the official Football League shop on this site: shirts, hoodies, kids' wear and accessories, made to order and shipped worldwide."

