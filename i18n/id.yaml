faq:
  kicker: "FAQ"
  title: "Pertanyaan, terjawab."
  items:
    - q: "Kapan Football League 2027 rilis?"
      a: "Football League 2027 (FL27) segera hadir di iPhone dan Android. Ikuti halaman Berita, Instagram, atau Discord kami, atau daftar newsletter, untuk tahu begitu game ini rilis."
    - q: "Apa yang baru di Football League 2027?"
      a: "FL27 menjadikan Mode Karier sebagai pusatnya dengan tampilan baru, liga kompetitif, sistem latihan dan transfer baru, serta hadiah akhir musim. FL27 juga menghadirkan fisika tabrakan yang lebih baik, penyelamatan kiper yang lebih halus, dan stadion baru yang canggih."
    - q: "Apakah FL27 sama dengan Football League 2027?"
      a: "Ya. FL27 adalah nama singkat Football League 2027, edisi 2027 dari Football League, game sepak bola mobile gratis dari Mobile Soccer."
    - q: "Apa bedanya FL27 dengan FL26?"
      a: "FL27 menambahkan Mode Karier yang didesain ulang dengan liga kompetitif, sistem latihan dan transfer baru, serta hadiah akhir musim, plus fisika tabrakan yang lebih baik, penyelamatan kiper yang lebih halus, stadion baru, dan tampilan yang lebih bersih dan modern."
    - q: "Apakah Football League 2027 ada di iPhone dan Android?"
      a: "Ya. Football League tersedia di App Store untuk iPhone dan iPad, serta di Google Play untuk ponsel dan tablet Android."
    - q: "Siapa pembuat Football League?"
      a: "Football League dikembangkan dan diterbitkan oleh Mobile Soccer. Game ini sudah diunduh lebih dari 100 juta kali dan masuk 10 besar game olahraga di lebih dari 30 pasar utama."
    - q: "Apakah Football League gratis?"
      a: "Ya. Football League gratis diunduh dan dimainkan di iPhone, iPad, serta ponsel dan tablet Android."
    - q: "Bisakah main Football League secara offline?"
      a: "Bisa. Kamu bisa main Football League secara offline tanpa koneksi internet, jadi tetap bisa dimainkan di pesawat, di kereta, atau saat tidak ingin memakai kuota. Sambungkan ke internet saat ingin memakai fitur online game."
    - q: "Mode permainan apa saja yang ada di Football League?"
      a: "Karier Pemain, Liga, Piala, dan Laga Persahabatan, ditambah tantangan harian, event live setiap minggu, dan PvP lokal untuk duel langsung dengan teman."
    - q: "Bisakah main Football League bareng teman?"
      a: "Bisa. PvP lokal memungkinkan kamu duel langsung dengan teman."
    - q: "Apakah ada event live di Football League?"
      a: "Ada. Event live dan tantangan baru hadir setiap minggu, dengan hadiah eksklusif seperti jersey, pemain, dan koin. Cek halaman Berita untuk melihat event yang sedang berlangsung."
    - q: "Komentar pertandingan tersedia dalam bahasa apa saja?"
      a: "Football League punya komentar pertandingan dalam 16 bahasa dan lebih dari 100 juta unduhan di lebih dari 200 negara."
    - q: "Bagaimana cara mendapat bantuan soal game, akun, atau pembelian?"
      a: "Kirim email ke tim dukungan pemain kami di footballleague2023@gmail.com, atau tanya komunitas di Discord kami."
    - q: "Di mana membeli merchandise resmi Football League?"
      a: "Di toko resmi Football League di situs ini: jersey, hoodie, pakaian anak, dan aksesori, dibuat sesuai pesanan dan dikirim ke seluruh dunia."

