        - id: can-you-play-football-league-offline
          q: "Bisakah main Football League secara offline?"
          a: "Bisa. Kamu bisa main Football League secara offline tanpa koneksi internet, jadi tetap bisa dimainkan di pesawat, di kereta, atau saat tidak ingin memakai kuota. Sambungkan ke internet saat ingin memakai fitur online game."
        - id: play-with-friends
          q: "Bisakah main Football League bareng teman?"
          a: "Bisa. PvP lokal memungkinkan kamu duel langsung dengan teman."
        - id: game-modes
          q: "Mode permainan apa saja yang ada di Football League?"
          a: "Karier Pemain, Liga, Piala, dan Laga Persahabatan, ditambah tantangan harian, event live setiap minggu, dan PvP lokal untuk duel langsung dengan teman."
        - id: career-mode
          q: "Apakah Football League punya mode karier?"
          a: "Ya. Mode Karier adalah pusat Football League 2027. Bangun Karier Pemain-mu, lalu bertanding di liga dengan sistem latihan dan transfer baru serta hadiah akhir musim."
        - id: controller-support
          q: "Bisakah main Football League pakai kontroler?"
          a: "Bisa. Football League mendukung kontroler game. Di layar sentuh, kamu juga bisa memilih berbagai mode kontrol kustom."
        - id: live-events
          q: "Apakah ada event live di Football League?"
          a: "Ada. Event live dan tantangan baru hadir setiap minggu, dengan hadiah eksklusif seperti jersey, pemain, dan koin. Cek halaman Berita untuk melihat event yang sedang berlangsung."
        - id: commentary-languages
          q: "Komentar pertandingan tersedia dalam bahasa apa saja?"
          a: "Football League punya komentar pertandingan dalam 16 bahasa dan lebih dari 100 juta unduhan di lebih dari 200 negara."
    - id: teams
      title: "Tim & kompetisi"
      items:
        - id: teams-and-players
          q: "Ada berapa tim dan pemain di Football League?"
          a: "Football League punya lebih dari 40.000 pemain, 1.500 klub, dan 150 tim nasional. Manchester City dan AS Monaco berlisensi resmi."
        - id: leagues-and-cups
          q: "Liga dan piala apa saja yang bisa dimainkan di Football League?"
          a: "Kamu bisa memainkan liga klub dari Eropa, Amerika, Asia, dan Afrika, atau membuat liga kustom sendiri. Ada juga piala klub tingkat benua dan turnamen internasional untuk tim nasional, dengan fase grup dan babak gugur sampai final."
    - id: fl27
      title: "Football League 2027 (FL27)"
      items:
