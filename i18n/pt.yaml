      items:
        - id: what-is-football-league
          q: "O que é o Football League?"
          a: "O Football League é um jogo de futebol grátis para iPhone, iPad e celulares e tablets Android, desenvolvido e publicado pela Mobile Soccer. Tem mais de 100 milhões de downloads e está entre os 10 melhores jogos de esporte em mais de 30 mercados. O Football League 2027 (FL27) é a edição 2027."
        - id: is-football-league-free
          q: "O Football League é grátis?"
          a: "Sim. O Football League é grátis para baixar e jogar no iPhone, iPad e Android. Há compras opcionais no app, como pacotes de moedas, uniformes oficiais de clubes e uma compra única para remover os anúncios, mas você não precisa comprar nada para jogar."
        - id: iphone-and-android
          q: "O Football League 2027 está no iPhone e no Android?"
          a: "Sim. O Football League está na App Store para iPhone e iPad, e no Google Play para celulares e tablets Android."
        - id: is-football-league-suitable-for-kids
          q: "O Football League é indicado para crianças?"
          a: "O Football League tem classificação 4+ na App Store, então é indicado para todas as idades. Os pais podem desativar as compras no app nas configurações do celular."
        - id: who-makes-football-league
          q: "Quem faz o Football League?"
          a: "O Football League é desenvolvido e publicado pela Mobile Soccer. Tem mais de 100 milhões de downloads e está entre os 10 melhores jogos de esporte em mais de 30 grandes mercados."
    - id: playing
      title: "Como jogar"
      items:
        - id: play-with-friends
          q: "Dá para jogar Football League com amigos?"
          a: "Sim. O PvP local permite enfrentar seus amigos frente a frente."
        - id: game-modes
          q: "Quais modos de jogo o Football League tem?"
          a: "Carreira de Jogador, Ligas, Copas e Amistosos, além de desafios diários, eventos ao vivo toda semana e PvP local para jogar contra os amigos."
        - id: career-mode
          q: "O Football League tem modo carreira?"
          a: "Sim. O Modo Carreira é o centro do Football League 2027. Monte sua Carreira de Jogador e dispute ligas com novos sistemas de treino e transferências e recompensas de fim de temporada."
        - id: controller-support
          q: "Dá para jogar Football League com controle?"
          a: "Sim. O Football League é compatível com controles. Na tela touch, você também pode escolher entre modos de controle personalizados."
        - id: live-events
          q: "O Football League tem eventos ao vivo?"
          a: "Sim. Toda semana chegam novos eventos ao vivo e desafios, com recompensas exclusivas como uniformes, jogadores e moedas. Veja a página de Notícias para saber o que está rolando agora."
        - id: commentary-languages
          q: "Em quais idiomas é a narração?"
          a: "O Football League tem narração em 16 idiomas e mais de 100 milhões de downloads em mais de 200 países."
    - id: teams
      title: "Times e competições"
      items:
        - id: teams-and-players
          q: "Quantos times e jogadores o Football League tem?"
          a: "O Football League tem mais de 40.000 jogadores, 1.500 clubes e 150 seleções. O Manchester City e o AS Monaco são licenciados oficialmente."
        - id: leagues-and-cups
          q: "Quais ligas e copas dá para jogar no Football League?"
          a: "Você pode jogar ligas de clubes da Europa, das Américas, da Ásia e da África, ou criar sua própria liga personalizada. Também há copas continentais de clubes e copas internacionais de seleções."
    - id: fl27
      title: "Football League 2027 (FL27)"
