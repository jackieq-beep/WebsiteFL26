faq:
  kicker: "Perguntas frequentes"
  title: Suas dúvidas, respondidas.
  items:
    - q: "Quando o Football League 2027 vai ser lançado?"
      a: "O Football League 2027 (FL27) chega em breve ao iPhone e ao Android. Acompanhe a página de Notícias, o Instagram ou o Discord, ou assine a newsletter, para saber assim que for lançado."
    - q: "O que há de novo no Football League 2027?"
      a: "O FL27 coloca o Modo Carreira no centro, com visual renovado, ligas competitivas, novos sistemas de treino e transferências e recompensas de fim de temporada. Também traz física de colisão aprimorada, defesas de goleiro refinadas e um estádio novo de última geração."
    - q: "FL27 é a mesma coisa que Football League 2027?"
      a: "Sim. FL27 é o nome curto do Football League 2027, a edição 2027 do Football League, o jogo de futebol grátis para celular da Mobile Soccer."
    - q: "Qual a diferença entre o FL27 e o FL26?"
      a: "O FL27 traz um Modo Carreira redesenhado com ligas competitivas, novos sistemas de treino e transferências e recompensas de fim de temporada, além de física de colisão aprimorada, defesas de goleiro refinadas, um estádio novinho e um visual mais limpo e moderno."
    - q: "O Football League 2027 está no iPhone e no Android?"
      a: "Sim. O Football League está na App Store para iPhone e iPad, e no Google Play para celulares e tablets Android."
    - q: "Quem faz o Football League?"
      a: "O Football League é desenvolvido e publicado pela Mobile Soccer. Tem mais de 100 milhões de downloads e está entre os 10 melhores jogos de esporte em mais de 30 grandes mercados."
    - q: "O Football League é grátis?"
      a: "Sim. O Football League é grátis para baixar e jogar no iPhone, iPad e em celulares e tablets Android."
    - q: "Quais modos de jogo o Football League tem?"
      a: "Carreira de Jogador, Ligas, Copas e Amistosos, além de desafios diários, eventos ao vivo toda semana e PvP local para jogar contra os amigos."
    - q: "Dá para jogar Football League com amigos?"
      a: "Sim. O PvP local permite enfrentar seus amigos frente a frente."
    - q: "O Football League tem eventos ao vivo?"
      a: "Sim. Toda semana chegam novos eventos ao vivo e desafios, com recompensas exclusivas como uniformes, jogadores e moedas. Veja a página de Notícias para saber o que está rolando agora."
    - q: "Em quais idiomas é a narração?"
      a: "O Football League tem narração em 16 idiomas e mais de 100 milhões de downloads em mais de 200 países."
    - q: "Como consigo ajuda com o jogo, minha conta ou uma compra?"
      a: "Envie um e-mail para o nosso suporte em footballleague2023@gmail.com, ou pergunte à comunidade no nosso Discord."
    - q: "Onde comprar produtos oficiais do Football League?"
      a: "Na loja oficial do Football League neste site: camisetas, moletons, roupas infantis e acessórios, feitos sob encomenda e enviados para o mundo todo."

